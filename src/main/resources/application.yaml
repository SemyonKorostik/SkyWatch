spring:
  application:
    name: SkyWatch
  datasource:
    url: jdbc:postgresql://localhost:5433/skywatch
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  cloud:
    openfeign:
      client:
        config:
          # Use 'default' to apply to ALL Feign clients
          default:
            loggerLevel: FULL
logging:
  level:
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    # Option A: Enable debugging for a specific client interface
    dev.korostik.skywatch.client.OpenWeatherApiClientProxy: DEBUG
geonames:
  username: semyon610
  style: FULL
  inside-boundary: TRUE
  geo-name-source: cities500
  max-rows: 1
open-meteo:
  api-key: ${OPEN_METEO_API_KEY}
telegram:
  bot:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_BOT_TOKEN}
    auth-url: ${telegram.bot.url}${telegram.bot.token}




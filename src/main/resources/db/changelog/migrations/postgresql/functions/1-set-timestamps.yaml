databaseChangeLog:
  - changeSet:
      id: '001-add-set-timestamps-function'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            endDelimiter: $$
            sql:
              create or replace function set_timestamps()
              returns trigger
              language plpgsql
              as $$
              begin
                if tg_op = 'INSERT' then
                  new.created_at := now();
                  new.updated_at := now();
                elsif tg_op = 'UPDATE' then
                  new.updated_at := now();
                end if;
                return new;
              end;
              $$;
      rollback:
        - sql:
            sql: drop function set_timestamps()

databaseChangeLog:
  - changeSet:
      id: '001'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_users_set_timestamps
              before insert or update on users
              for each row
              execute function set_timestamps();
      rollback:
        - sql:
            sql: drop trigger trg_users_set_timestamps on users
  - changeSet:
      id: '002'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_location_set_timestamps
              before insert or update on location
              for each row
              execute function set_timestamps();
        - sql:
            sql:
              create trigger trg_location_set_geog
              before insert or update on location
              for each row
              execute function set_location_geog();
      rollback:
        - sql:
            sql: drop trigger trg_location_set_geog on location
        - sql:
            sql: drop trigger trg_location_set_timestamps on location

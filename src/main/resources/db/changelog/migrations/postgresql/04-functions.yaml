databaseChangeLog:
  - changeSet:
      id: '001'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION set_timestamps()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.updated_at = CURRENT_TIMESTAMP;
                IF NEW.created_at IS NULL THEN
                  NEW.created_at = CURRENT_TIMESTAMP;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS set_timestamps();
  - changeSet:
      id: '002'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION set_location_geog()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.geog = ST_SetSRID(ST_MakePoint(NEW.longitude, NEW.latitude), 4326);
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS set_location_geog();

databaseChangeLog:
  - changeSet:
      id: '001-add-weather-conditions-foreign-keys'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              alter table weather_conditions
              add constraint fk_weather_conditions_provider foreign key (provider_name) references weather_provider (name);
        - sql:
            sql:
              alter table weather_conditions
              add constraint fk_weather_conditions_wmo_code foreign key (wmo_code) references wmo_weather_codes (code);
      rollback:
        - sql:
            sql: alter table weather_conditions drop constraint fk_weather_conditions_wmo_code
        - sql:
            sql: alter table weather_conditions drop constraint fk_weather_conditions_provider

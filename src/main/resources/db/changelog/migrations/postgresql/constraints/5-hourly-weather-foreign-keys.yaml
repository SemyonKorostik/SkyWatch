databaseChangeLog:
  - changeSet:
      id: '001-add-hourly-weather-foreign-keys'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              alter table hourly_weather
              add constraint fk_hourly_weather_location foreign key (location_id) references location (id);
        - sql:
            sql:
              alter table hourly_weather
              add constraint fk_hourly_weather_condition foreign key (weather_condition_id) references weather_conditions (id);
      rollback:
        - sql:
            sql: alter table hourly_weather drop constraint fk_hourly_weather_condition
        - sql:
            sql: alter table hourly_weather drop constraint fk_hourly_weather_location

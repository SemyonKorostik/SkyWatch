databaseChangeLog:
  - changeSet:
      id: '001-add-users-foreign-keys'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              alter table users
              add constraint fk_users_location foreign key (location_id) references location (id);
      rollback:
        - sql:
            sql: alter table users drop constraint fk_users_location

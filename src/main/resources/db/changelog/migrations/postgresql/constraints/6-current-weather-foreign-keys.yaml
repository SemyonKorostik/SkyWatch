databaseChangeLog:
  - changeSet:
      id: '001-add-current-weather-foreign-keys'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              alter table current_weather
              add constraint fk_current_weather_location foreign key (location_id) references location (id);
        - sql:
            sql:
              alter table current_weather
              add constraint fk_current_weather_condition foreign key (weather_condition_id) references weather_conditions (id);
      rollback:
        - sql:
            sql: alter table current_weather drop constraint fk_current_weather_condition
        - sql:
            sql: alter table current_weather drop constraint fk_current_weather_location

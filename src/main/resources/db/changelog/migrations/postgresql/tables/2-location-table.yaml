databaseChangeLog:
  - changeSet:
      id: '001-add-location-table'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create table location
              (
              id           bigserial              not null,
              latitude     double precision       not null,
              longitude    double precision       not null,
              time_zone_id varchar(255)           not null,
              geog         geography(Point, 4326) not null,
              created_at   timestamp              default CURRENT_TIMESTAMP not null,
              updated_at   timestamp              default CURRENT_TIMESTAMP not null,
              constraint pk_location primary key (id),
              constraint chk_location_latitude check (latitude between -90 and 90),
              constraint chk_location_longitude check (longitude between -180 and 180)
              );
      rollback:
        - sql:
            sql: drop table location

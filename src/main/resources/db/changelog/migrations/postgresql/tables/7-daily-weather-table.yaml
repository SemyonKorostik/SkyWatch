databaseChangeLog:
  - changeSet:
      id: '001-add-daily-weather-table'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create table daily_weather
              (
              location_id          bigint           not null,
              date                 timestamp        not null,
              weather_condition_id bigint           not null,
              temperature_max      double precision not null,
              temperature_min      double precision not null,
              wind_speed           double precision not null,
              wind_direction       integer,
              humidity             integer,
              created_at           timestamp        default CURRENT_TIMESTAMP not null,
              updated_at           timestamp        default CURRENT_TIMESTAMP not null,
              constraint pk_daily_weather primary key (location_id, date),
              constraint chk_daily_weather_wind_speed check (wind_speed >= 0),
              constraint chk_daily_weather_humidity check (humidity between 0 and 100),
              constraint chk_daily_weather_wind_direction check (wind_direction between 0 and 360),
              constraint chk_daily_weather_temperature_range check (temperature_max >= temperature_min)
              );
      rollback:
        - sql:
            sql: drop table daily_weather
  - changeSet:
      id: '002-remove-default-timestamp'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              ALTER TABLE daily_weather ALTER COLUMN created_at DROP DEFAULT;
              ALTER TABLE daily_weather ALTER COLUMN updated_at DROP DEFAULT;
      rollback:
        - sql:
            sql:
              ALTER TABLE daily_weather ALTER COLUMN created_at SET DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE daily_weather ALTER COLUMN updated_at SET DEFAULT CURRENT_TIMESTAMP;

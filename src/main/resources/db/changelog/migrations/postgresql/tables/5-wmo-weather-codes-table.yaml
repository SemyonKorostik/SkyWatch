databaseChangeLog:
  - changeSet:
      id: '001-add-wmo-weather-codes-table'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create table wmo_weather_codes
              (
              code          varchar(2)  not null,
              description   text        not null,
              category      varchar(50) not null,
              subcategory   varchar(100),
              emoji         varchar(10) not null,
              intensity     varchar(20),
              weather_group varchar(30) not null,
              created_at    timestamp   default CURRENT_TIMESTAMP not null,
              updated_at    timestamp   default CURRENT_TIMESTAMP not null,
              constraint pk_wmo_weather_codes primary key (code)
              );
      rollback:
        - sql:
            sql: drop table wmo_weather_codes
  - changeSet:
      id: '002-remove-default-timestamp'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              ALTER TABLE wmo_weather_codes ALTER COLUMN created_at DROP DEFAULT;
              ALTER TABLE wmo_weather_codes ALTER COLUMN updated_at DROP DEFAULT;
      rollback:
        - sql:
            sql:
              ALTER TABLE wmo_weather_codes ALTER COLUMN created_at SET DEFAULT CURRENT_TIMESTAMP;
              ALTER TABLE wmo_weather_codes ALTER COLUMN updated_at SET DEFAULT CURRENT_TIMESTAMP;

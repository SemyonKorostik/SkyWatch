databaseChangeLog:
  - changeSet:
      id: '001-add-weather-conditions-table'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create table weather_conditions
              (
              id            bigserial    not null,
              provider_name varchar(255) not null,
              provider_code varchar(10)  not null,
              wmo_code      varchar(2)   not null,
              constraint pk_weather_conditions primary key (id)
              );
      rollback:
        - sql:
            sql: drop table weather_conditions

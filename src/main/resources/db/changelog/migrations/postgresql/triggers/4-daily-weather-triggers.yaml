databaseChangeLog:
  - changeSet:
      id: '001-add-daily-weather-timestamps-triggers'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_daily_weather_set_timestamps
              before insert or update on daily_weather
              for each row
              execute function set_timestamps();
      rollback:
        - sql:
            sql: drop trigger trg_daily_weather_set_timestamps on daily_weather

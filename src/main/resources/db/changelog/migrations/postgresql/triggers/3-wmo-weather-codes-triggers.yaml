databaseChangeLog:
  - changeSet:
      id: '001-add-wmo-weather-codes-timestamps-triggers'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_wmo_weather_codes_set_timestamps
              before insert or update on wmo_weather_codes
              for each row
              execute function set_timestamps();
      rollback:
        - sql:
            sql: drop trigger trg_wmo_weather_codes_set_timestamps on wmo_weather_codes

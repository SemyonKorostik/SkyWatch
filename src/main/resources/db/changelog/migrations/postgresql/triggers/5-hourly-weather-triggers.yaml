databaseChangeLog:
  - changeSet:
      id: '001-add-hourly-weather-timestamps-triggers'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_hourly_weather_set_timestamps
              before insert or update on hourly_weather
              for each row
              execute function set_timestamps();
      rollback:
        - sql:
            sql: drop trigger trg_hourly_weather_set_timestamps on hourly_weather
  - changeSet:
      id: '002-remove-hourly-weather-timestamps-trigger'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql: drop trigger trg_hourly_weather_set_timestamps on hourly_weather
      rollback:
        - sql:
            sql:
              create trigger trg_hourly_weather_set_timestamps
              before insert or update on hourly_weather
              for each row
              execute function set_timestamps();

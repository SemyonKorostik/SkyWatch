databaseChangeLog:
  - changeSet:
      id: '001-add-location-timestamps-triggers'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_location_set_timestamps
              before insert or update on location
              for each row
              execute function set_timestamps();
      rollback:
        - sql:
            sql: drop trigger trg_location_set_timestamps on location
  - changeSet:
      id: '002-add-location-geog-triggers'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql:
              create trigger trg_location_set_geog
              before insert or update on location
              for each row
              execute function set_location_geog();
      rollback:
        - sql:
            sql: drop trigger trg_location_set_geog on location
  - changeSet:
      id: '003-remove-location-timestamps-trigger'
      author: 's.korostik'
      dbms: postgresql
      changes:
        - sql:
            sql: drop trigger trg_location_set_timestamps on location
      rollback:
        - sql:
            sql:
              create trigger trg_location_set_timestamps
              before insert or update on location
              for each row
              execute function set_timestamps();

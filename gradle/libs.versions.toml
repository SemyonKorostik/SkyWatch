[versions]
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
dependency-management = "1.1.7"
lombok = "1.18.46"
java = "21"
junit = "6.1.3"
testcontainers = "1.21.4"
postgresql = "42.7.13"
mapstruct = "1.6.3"

[libraries]
#Spring Boot
spring-boot-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools" }
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor" }
spring-boot-testcontainers = { group = "org.springframework.boot", name = "spring-boot-testcontainers" }
spring-boot-starter-liquibase = { group = "org.springframework.boot", name = "spring-boot-starter-liquibase" }

#Spring Cloud
spring-cloud = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-openfeign = { group = "org.springframework.cloud", name = "spring-cloud-starter-openfeign" }

#Lombok
projectlombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

#JUnit
junit = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

#TestContainres
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }

#PostgreSQL
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }

#MapStruct
mapsrtruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct"}

[plugins]
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
